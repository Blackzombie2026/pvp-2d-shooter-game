<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP 2D Shooter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: Arial, sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 3px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            display: block;
            background: #1a1a2e;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- Load Phaser from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>

    <!-- ALL Game Code in One File -->
    <script>
        // ============ CONFIGURATION ============
        const GAME_CONSTANTS = {
            PLAYER_SPEED: 300,
            PROJECTILE_SPEED: 500,
            WEAPON_COOLDOWN: 300,
            MAX_HEALTH: 100,
            OBSTACLE_TYPES: ['box', 'house'],
            RANKS: {
                1: { name: 'Rookie', color: 0x808080, fireRate: 300, damage: 10 },
                2: { name: 'Soldier', color: 0x00aa00, fireRate: 250, damage: 15 },
                3: { name: 'Captain', color: 0x0066ff, fireRate: 200, damage: 20 },
                4: { name: 'Major', color: 0xffaa00, fireRate: 150, damage: 25 },
                5: { name: 'Commander', color: 0xff0000, fireRate: 100, damage: 35 }
            }
        };

        // ============ BOOT SCENE ============
        class BootScene extends Phaser.Scene {
            constructor() {
                super('BootScene');
            }
            preload() {}
            create() {
                this.scene.start('MenuScene');
            }
        }

        // ============ MENU SCENE ============
        class MenuScene extends Phaser.Scene {
            constructor() {
                super('MenuScene');
            }
            create() {
                const centerX = this.cameras.main.width / 2;
                const centerY = this.cameras.main.height / 2;

                this.add.text(centerX, centerY - 150, 'PvP 2D SHOOTER', {
                    font: 'bold 60px Arial',
                    fill: '#00ff00',
                    align: 'center'
                }).setOrigin(0.5);

                this.add.text(centerX, centerY - 50, 'Top-Down Action Battle', {
                    font: '24px Arial',
                    fill: '#ffff00',
                    align: 'center'
                }).setOrigin(0.5);

                const startButton = this.add.text(centerX, centerY + 50, 'START GAME', {
                    font: 'bold 28px Arial',
                    fill: '#ffffff',
                    backgroundColor: '#00aa00',
                    padding: { x: 20, y: 10 }
                }).setOrigin(0.5).setInteractive();

                startButton.on('pointerover', () => {
                    startButton.setStyle({ backgroundColor: '#00ff00' });
                });

                startButton.on('pointerout', () => {
                    startButton.setStyle({ backgroundColor: '#00aa00' });
                });

                startButton.on('pointerdown', () => {
                    this.scene.start('GameScene');
                });

                this.add.text(centerX, centerY + 150, 'Player 1: WASD + Mouse to aim/shoot\\nPlayer 2: Arrow Keys + Click to aim/shoot', {
                    font: '16px Arial',
                    fill: '#cccccc',
                    align: 'center'
                }).setOrigin(0.5);

                this.add.text(centerX, centerY + 230, 'Features: 5 Ranks • Weapon Upgrades • Obstacles', {
                    font: 'bold 18px Arial',
                    fill: '#00ffff',
                    align: 'center'
                }).setOrigin(0.5);
            }
        }

        // ============ PLAYER CLASS ============
        class Player {
            constructor(scene, x, y, playerNumber, color) {
                this.scene = scene;
                this.playerNumber = playerNumber;
                this.color = color;
                this.health = GAME_CONSTANTS.MAX_HEALTH;
                this.score = 0;
                this.rankSystem = null;
                this.weapon = null;

                this.sprite = scene.physics.add.sprite(x, y, null);
                this.sprite.setCollideWorldBounds(true);
                this.sprite.setBounce(0.2);

                const graphics = scene.make.graphics({ x: 0, y: 0, add: false });
                graphics.fillStyle(color, 1);
                graphics.fillCircle(15, 15, 15);
                graphics.generateTexture('player' + playerNumber, 30, 30);
                graphics.destroy();

                this.sprite.setTexture('player' + playerNumber);
                this.sprite.setScale(1.5);
            }

            setVelocity(velocity) {
                this.sprite.setVelocity(velocity.x, velocity.y);
            }

            rotateTowards(x, y) {
                const angle = Phaser.Math.Angle.Between(this.sprite.x, this.sprite.y, x, y);
                this.sprite.setRotation(angle);
            }

            takeDamage(amount) {
                this.health -= amount;
                if (this.health < 0) this.health = 0;
                this.sprite.setTint(0xff0000);
                this.scene.time.delayedCall(100, () => {
                    this.sprite.clearTint();
                });
            }
        }

        // ============ PROJECTILE CLASS ============
        class Projectile {
            constructor(scene, x, y, targetX, targetY, speed, group) {
                this.scene = scene;
                const angle = Phaser.Math.Angle.Between(x, y, targetX, targetY);
                const velocity = new Phaser.Math.Vector2(Math.cos(angle) * speed, Math.sin(angle) * speed);

                this.sprite = scene.physics.add.sprite(x, y, null);
                const graphics = scene.make.graphics({ x: 0, y: 0, add: false });
                graphics.fillStyle(0xffff00, 1);
                graphics.fillCircle(4, 4, 4);
                graphics.generateTexture('projectile', 8, 8);
                graphics.destroy();

                this.sprite.setTexture('projectile');
                this.sprite.setVelocity(velocity.x, velocity.y);
                this.sprite.setRotation(angle);
                this.sprite.setGravityY(0);
                group.add(this.sprite);

                scene.time.delayedCall(10000, () => {
                    if (this.sprite && this.sprite.active) this.sprite.destroy();
                });
            }
        }

        // ============ WEAPON CLASS ============
        class Weapon {
            constructor(scene, player, projectileGroup) {
                this.scene = scene;
                this.player = player;
                this.projectileGroup = projectileGroup;
                this.lastFiredTime = 0;
                this.fireRate = GAME_CONSTANTS.WEAPON_COOLDOWN;
            }

            fire(targetX, targetY) {
                const now = this.scene.time.now;
                if (now - this.lastFiredTime < this.fireRate) return;

                this.lastFiredTime = now;
                new Projectile(this.scene, this.player.sprite.x, this.player.sprite.y, targetX, targetY, GAME_CONSTANTS.PROJECTILE_SPEED, this.projectileGroup);
                const recoilAngle = this.player.sprite.rotation + Math.PI;
                this.player.sprite.setVelocity(Math.cos(recoilAngle) * 50, Math.sin(recoilAngle) * 50);
            }
        }

        // ============ OBSTACLE CLASS ============
        class Obstacle {
            constructor(scene, x, y, type, width, height) {
                this.scene = scene;
                this.type = type;
                this.sprite = scene.physics.add.sprite(x, y, null);
                this.sprite.setImmovable(true);

                if (type === 'box') {
                    const graphics = scene.make.graphics({ x: 0, y: 0, add: false });
                    graphics.fillStyle(0x8b4513, 1);
                    graphics.fillRect(0, 0, 60, 60);
                    graphics.lineStyle(2, 0x654321, 1);
                    graphics.strokeRect(0, 0, 60, 60);
                    graphics.generateTexture('obstacle_box', 60, 60);
                    graphics.destroy();
                    this.sprite.setTexture('obstacle_box');
                } else if (type === 'house') {
                    const graphics = scene.make.graphics({ x: 0, y: 0, add: false });
                    graphics.fillStyle(0xd2691e, 1);
                    graphics.fillRect(0, 20, 100, 60);
                    graphics.fillStyle(0x8b0000, 1);
                    graphics.fillTriangleShape(new Phaser.Geom.Triangle(50, 0, 0, 20, 100, 20));
                    graphics.fillStyle(0x654321, 1);
                    graphics.fillRect(40, 60, 20, 20);
                    graphics.generateTexture('obstacle_house', 100, 80);
                    graphics.destroy();
                    this.sprite.setTexture('obstacle_house');
                }

                this.sprite.setDisplaySize(width, height);
                scene.obstacles.add(this.sprite);
            }
        }

        // ============ RANK SYSTEM ============
        class RankSystem {
            constructor(playerNumber) {
                this.playerNumber = playerNumber;
                this.rank = 1;
            }

            getDamage() {
                return GAME_CONSTANTS.RANKS[this.rank].damage;
            }

            rankUp() {
                if (this.rank < 5) this.rank++;
            }
        }

        // ============ GAME SCENE ============
        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
            }

            create() {
                this.player1 = new Player(this, 200, 360, 1, 0x00aa00);
                this.player2 = new Player(this, 1080, 360, 2, 0xff0000);

                this.obstacles = this.physics.add.group();
                const obstaclePositions = [
                    { x: 640, y: 360, type: 'box', width: 60, height: 60 },
                    { x: 300, y: 200, type: 'house', width: 100, height: 80 },
                    { x: 980, y: 200, type: 'house', width: 100, height: 80 },
                    { x: 300, y: 520, type: 'box', width: 60, height: 60 },
                    { x: 980, y: 520, type: 'box', width: 60, height: 60 }
                ];
                obstaclePositions.forEach(obs => new Obstacle(this, obs.x, obs.y, obs.type, obs.width, obs.height));

                this.projectiles1 = this.physics.add.group();
                this.projectiles2 = this.physics.add.group();

                this.player1.weapon = new Weapon(this, this.player1, this.projectiles1);
                this.player2.weapon = new Weapon(this, this.player2, this.projectiles2);

                this.player1.rankSystem = new RankSystem(1);
                this.player2.rankSystem = new RankSystem(2);

                this.physics.add.overlap(this.projectiles1, this.player2.sprite, (projectile) => {
                    const damage = this.player1.rankSystem.getDamage();
                    this.player2.takeDamage(damage);
                    projectile.destroy();
                    this.player1.score += 10;
                });

                this.physics.add.overlap(this.projectiles2, this.player1.sprite, (projectile) => {
                    const damage = this.player2.rankSystem.getDamage();
                    this.player1.takeDamage(damage);
                    projectile.destroy();
                    this.player2.score += 10;
                });

                this.physics.add.collider(this.projectiles1, this.obstacles, (projectile) => projectile.destroy());
                this.physics.add.collider(this.projectiles2, this.obstacles, (projectile) => projectile.destroy());
                this.physics.add.collider(this.player1.sprite, this.obstacles);
                this.physics.add.collider(this.player2.sprite, this.obstacles);

                this.keys1 = {
                    w: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W),
                    a: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A),
                    s: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S),
                    d: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D)
                };

                this.keys2 = {
                    up: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.UP),
                    left: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT),
                    down: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.DOWN),
                    right: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT)
                };

                this.input.on('pointerdown', (pointer) => {
                    if (!this.gameOver) {
                        this.player1.weapon.fire(pointer.x, pointer.y);
                        this.player2.weapon.fire(pointer.x, pointer.y);
                    }
                });

                this.player1HUD = this.add.text(10, 10, '', { font: '16px Arial', fill: '#00ff00' });
                this.player2HUD = this.add.text(1270, 10, '', { font: '16px Arial', fill: '#ff0000' }).setOrigin(1, 0);
                this.rankDisplay1 = this.add.text(10, 60, '', { font: 'bold 20px Arial', fill: '#ffff00' });
                this.rankDisplay2 = this.add.text(1270, 60, '', { font: 'bold 20px Arial', fill: '#ffff00' }).setOrigin(1, 0);

                this.gameOver = false;
            }

            update() {
                if (this.gameOver) return;

                const vel1 = new Phaser.Math.Vector2(0, 0);
                if (this.keys1.w.isDown) vel1.y = -GAME_CONSTANTS.PLAYER_SPEED;
                if (this.keys1.s.isDown) vel1.y = GAME_CONSTANTS.PLAYER_SPEED;
                if (this.keys1.a.isDown) vel1.x = -GAME_CONSTANTS.PLAYER_SPEED;
                if (this.keys1.d.isDown) vel1.x = GAME_CONSTANTS.PLAYER_SPEED;
                this.player1.setVelocity(vel1);

                const vel2 = new Phaser.Math.Vector2(0, 0);
                if (this.keys2.up.isDown) vel2.y = -GAME_CONSTANTS.PLAYER_SPEED;
                if (this.keys2.down.isDown) vel2.y = GAME_CONSTANTS.PLAYER_SPEED;
                if (this.keys2.left.isDown) vel2.x = -GAME_CONSTANTS.PLAYER_SPEED;
                if (this.keys2.right.isDown) vel2.x = GAME_CONSTANTS.PLAYER_SPEED;
                this.player2.setVelocity(vel2);

                const pointer = this.input.activePointer;
                this.player1.rotateTowards(pointer.x, pointer.y);
                this.player2.rotateTowards(pointer.x, pointer.y);

                this.player1HUD.setText(`Player 1 HP: ${this.player1.health}`);
                this.player2HUD.setText(`Player 2 HP: ${this.player2.health}`);
                const rank1 = GAME_CONSTANTS.RANKS[this.player1.rankSystem.rank];
                const rank2 = GAME_CONSTANTS.RANKS[this.player2.rankSystem.rank];
                this.rankDisplay1.setText(`${rank1.name}`);
                this.rankDisplay2.setText(`${rank2.name}`);

                if (this.player1.health <= 0 || this.player2.health <= 0) {
                    this.gameOver = true;
                    const winner = this.player1.health > 0 ? 'PLAYER 1' : 'PLAYER 2';
                    this.add.text(640, 360, `${winner} WINS!`, {
                        font: 'bold 80px Arial',
                        fill: '#ffff00',
                        align: 'center',
                        backgroundColor: '#000000',
                        padding: { x: 20, y: 20 }
                    }).setOrigin(0.5).setDepth(100);

                    const restartText = this.add.text(640, 450, 'Click to Return to Menu', {
                        font: '24px Arial',
                        fill: '#00ff00',
                        align: 'center'
                    }).setOrigin(0.5).setInteractive();

                    restartText.on('pointerdown', () => {
                        this.scene.start('MenuScene');
                    });
                }
            }
        }

        // ============ GAME CONFIGURATION ============
        const gameConfig = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            backgroundColor: '#1a1a2e',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: [BootScene, MenuScene, GameScene],
            render: {
                pixelArt: false,
                antialias: true
            }
        };

        // ============ START GAME ============
        const game = new Phaser.Game(gameConfig);
    </script>
</body>
</html>
